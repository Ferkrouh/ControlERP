version: '3.8'

services:
  # 1. Base de Datos Corporativa PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: controlerp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-controlerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno}
      POSTGRES_DB: ${POSTGRES_DB:-controlerp_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expuesto solo al localhost del servidor para pg_dump y tareas administrativas
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controlerp} -d ${POSTGRES_DB:-controlerp_db}"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - controlerp-net

  # 2. Aplicación Web ControlERP (Next.js 15)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlerp-app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-controlerp}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno}@postgres:5432/${POSTGRES_DB:-controlerp_db}?schema=public
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-ControlERP}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el entorno}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - controlerp-net

  # 3. Túnel Seguro Cloudflare Zero Trust (Acceso remoto mundial HTTPS sin abrir puertos)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: controlerp-tunnel
    restart: always
    profiles: ["cloudflare"]
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    networks:
      - controlerp-net

volumes:
  postgres_data:
    driver: local

networks:
  controlerp-net:
    driver: bridge
